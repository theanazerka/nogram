name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        project:
          - telegram   # original Telegram iOS 4.9.1
          - lite       # minimal client (fallback)
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
        with:
          path: nogram
          fetch-depth: 0   # full history for git restore-mtime

      # --- caches: toolchain + compiled objects, so CI only rebuilds what changed ---
      - name: Restore Theos/toolchain/SDK cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-11.4-v1

      - name: Restore object cache
        uses: actions/cache/restore@v4
        with:
          path: nogram/${{ matrix.project }}/.theos
          key: obj-${{ matrix.project }}-${{ github.sha }}
          restore-keys: obj-${{ matrix.project }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot curl perl git libxml2 libtinfo5 zip python3

      - name: Restore file timestamps from git history
        working-directory: nogram
        run: |
          # Fresh checkouts make every file "new"; give files their last-commit time so
          # make reuses cached objects for unchanged sources.
          python3 tools/restore-mtime.py

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$THEOS/toolchain/"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          # SDK goes in here too so the whole directory is cached.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS11.4.sdk
          mkdir -p "$THEOS/sdks"
          mv /tmp/sdks/iPhoneOS11.4.sdk "$THEOS/sdks/"

      - name: Patch Theos
        run: |
          # Report every compile error in one run instead of stopping at the first one.
          sed -i 's/--no-keep-going/--keep-going/g' "$THEOS/makefiles/common.mk" "$THEOS/makefiles/instance/rules.mk"
          # Link through -filelist: ~3000 object paths overflow bash's 128 KiB argument limit.
          python3 nogram/tools/patch-theos-link.py "$THEOS/makefiles/instance/rules.mk"

      - name: Build
        working-directory: nogram/${{ matrix.project }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -o pipefail
          # Objects come from cache, but always relink: make does not notice LDFLAGS changes.
          find .theos/obj -maxdepth 2 -name '*.app' -type d -prune -exec rm -r {} + 2>/dev/null || true
          # Every CI build gets a higher version so Cydia offers it as an update.
          VERSION="$(sed -n 's/^Version: *//p' control)-${{ github.run_number }}"
          make ipa FINALPACKAGE=1 PACKAGE_VERSION="$VERSION" TG_API_ID="$TG_API_ID" TG_API_HASH="$TG_API_HASH" -j"$(nproc)" -k 2>&1 | tee build.log
          ls -la packages

      - name: Restore iOS 6 system libraries cache
        id: ios6-cache
        uses: actions/cache@v4
        with:
          path: ios6sdk
          key: ios6-libs-v1

      - name: Fetch iOS 6 system libraries
        if: steps.ios6-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/Alex1s/iPhoneOS6.0.sdk ios6sdk
          cd ios6sdk
          git ls-tree -r --name-only HEAD | grep -E '^(usr/lib/[^/]+\.dylib|usr/lib/system/[^/]+\.dylib|System/Library/(Private)?Frameworks/[^/]+\.framework/[^/.]+|System/Library/Frameworks/[^/]+\.framework/Frameworks/[^/]+\.framework/[^/.]+)$' > ../ios6-paths.txt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone --stdin < ../ios6-paths.txt
          git checkout -q
          rm -rf .git

      - name: Check binary against iOS 6 libraries
        working-directory: nogram/${{ matrix.project }}
        run: |
          sudo apt-get install -y llvm >/dev/null
          APP=$(ls -d .theos/_/Applications/*.app)
          BIN="$APP/$(basename "$APP" .app)"
          # A strong import missing from iOS 6 makes dyld kill the app at launch.
          python3 ../tools/check-ios6-imports.py "$BIN" "$GITHUB_WORKSPACE/ios6sdk"

      - name: Save object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: nogram/${{ matrix.project }}/.theos
          key: obj-${{ matrix.project }}-${{ github.sha }}

      - name: Error summary
        if: failure()
        working-directory: nogram/${{ matrix.project }}
        run: |
          grep -E "error:|Undefined symbols|ld: " build.log | sed -E 's/\x1b\[[0-9;]*m//g' | sort | uniq -c | sort -rn | head -150 || true
          echo "----- files with errors -----"
          sed -E 's/\x1b\[[0-9;]*m//g' build.log | grep -oE "^[^ :]+\.(m|mm|c|cpp|h):[0-9]+:[0-9]+: (fatal )?error" | cut -d: -f1 | sort | uniq -c | sort -rn | head -80 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.project }}
          path: nogram/${{ matrix.project }}/build.log

      - name: Inspect binary
        working-directory: nogram/${{ matrix.project }}
        run: |
          APP=$(ls -d .theos/_/Applications/*.app)
          BIN="$APP/$(basename "$APP" .app)"
          file "$BIN" || true
          "$THEOS/toolchain/linux/iphone/bin/otool" -l "$BIN" | grep -A4 -E "LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION" || true
          "$THEOS/toolchain/linux/iphone/bin/otool" -L "$BIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: |
            nogram/${{ matrix.project }}/packages/*.deb
            nogram/${{ matrix.project }}/packages/*.ipa

  # Cydia repository on GitHub Pages: https://<owner>.github.io/<repo>/
  # Published to the gh-pages branch (Settings -> Pages -> Deploy from a branch -> gh-pages).
  repo:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: nogram

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build Cydia repo
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2
          python3 nogram/tools/make-cydia-repo.py artifacts site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          ls -la site site/debs

      - name: Publish to gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Cydia repo from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
